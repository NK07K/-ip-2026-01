<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta — VitaCare</title>
  <link rel="stylesheet" href="/styles/createAccount.style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="bg-blob"></div>

  <div class="page-wrapper">
    <a href="/" class="back-link">← Voltar</a>

    <div class="form-card">
      <div class="form-header">
        <span class="form-icon">➕</span>
        <h1>Criar Conta</h1>
        <p>Preencha os dados para se cadastrar no sistema.</p>
      </div>

      <form action="/api/create" method="POST" class="form">
        <div class="field">
          <label for="username">Nome completo</label>
          <input type="text" id="username" name="username" placeholder="Dr. João Silva" required minlength="3">
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="joao@hospital.com" required>
        </div>

        <div class="field">
          <label for="born_date">Data de nascimento</label>
          <input type="date" id="born_date" name="born_date" required>
        </div>

        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>

        <button type="submit" class="btn-submit">Criar conta</button>
      </form>
    </div>
  </div>
</body>
</html>
